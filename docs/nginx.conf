# Install a certificate trusted by your LAN, adapt the hostname and certificate paths.
server {
    listen 443 ssl;
    server_name plans.exemple.local;
    ssl_certificate /etc/ssl/local/plans.crt;
    ssl_certificate_key /etc/ssl/local/plans.key;
    client_max_body_size 51m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
