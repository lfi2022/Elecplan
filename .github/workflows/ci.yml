name: Build and verify ElectroPlan
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - run: bash scripts/build-deb.sh
      - run: sudo bash scripts/linux-smoke.sh artifacts/electroplan_1.0.0_amd64.deb
      - name: Service diagnostics on failure
        if: failure()
        run: sudo journalctl -u electroplan -n 150 --no-pager
      - uses: actions/upload-artifact@v4
        with:
          name: electroplan-debian-amd64
          path: artifacts/*
